name: keep-worker-awake

# Pings the Flower Hotel Gmail worker so Render's free tier doesn't spin it down.
# Render sleeps a free web service after ~15 min idle, and the worker's in-process
# self-ping can't wake a fully-slept instance — only an EXTERNAL request can. This
# workflow is that external request. (Note: GitHub's scheduler is best-effort and
# can run late/skip; UptimeRobot is more precise. This is the free, no-signup option.)

on:
  schedule:
    # every ~5 min (GitHub often runs these late; frequent scheduling hedges the delay)
    - cron: '*/5 * * * *'
  workflow_dispatch: {}   # allow manual "Run workflow" from the Actions tab

# Don't pile up overlapping runs
concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping worker (with cold-start retries)
        run: |
          URL="https://flower-hotel-gmail-worker.onrender.com/"
          echo "Pinging $URL at $(date -u)"
          for i in 1 2 3 4; do
            code=$(curl -s -o /tmp/body -w '%{http_code}' -m 70 "$URL" || echo 000)
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "worker awake:"; cat /tmp/body; echo
              exit 0
            fi
            echo "not up yet (cold start can take ~50s), retrying..."
            sleep 25
          done
          # Never fail the job — the ping itself is what wakes the instance, and a
          # failed run would only send noise. Just log and exit clean.
          echo "did not get 200 after retries; the request should still have woken it."
          exit 0
